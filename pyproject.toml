[project]
name = "carolus-ops"
version = "0.1.0"
description = "Carolus Advisory operations: QBO sync, rules engine, knowledge layer, document pipeline, routines"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv",
    "cryptography",
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
# Pipeline modules, not an installable package (revisit when modules ship)
package = false

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
# flat module layout (db/, sync/, ...) — make repo root importable in tests
pythonpath = ["."]
